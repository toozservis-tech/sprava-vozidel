name: TooZHubiOS
options:
  deploymentTarget:
    iOS: 17.0
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: 5.0
    PRODUCT_BUNDLE_IDENTIFIER: cz.toozservis.spravavozidel.ios
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Správa vozidel
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDefault
    INFOPLIST_KEY_UIRequiresFullScreen: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Správa vozidel potřebuje přístup k fotkám kvůli přílohám servisních záznamů.
    INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Správa vozidel ukládá vygenerované výstupy a snímky vozidel.
    INFOPLIST_KEY_NSCameraUsageDescription: Správa vozidel potřebuje kameru pro focení vozidel a účtenek.
    INFOPLIST_KEY_NSFaceIDUsageDescription: Správa vozidel používá Face ID jen pro lokální odemčení aplikace na tomto zařízení.
    INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Správa vozidel používá polohu pro vyhledání blízkých servisů.
    INFOPLIST_KEY_CFBundleDevelopmentRegion: cs
    INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
    INFOPLIST_KEY_NSAppTransportSecurity_NSExceptionDomains_localhost_NSTemporaryExceptionAllowsInsecureHTTPLoads: YES
    INFOPLIST_KEY_NSAppTransportSecurity_NSExceptionDomains_localhost_NSIncludesSubdomains: YES
    INFOPLIST_KEY_NSAppTransportSecurity_NSExceptionDomains_127.0.0.1_NSTemporaryExceptionAllowsInsecureHTTPLoads: YES
    INFOPLIST_KEY_NSAppTransportSecurity_NSExceptionDomains_127.0.0.1_NSIncludesSubdomains: YES
    TARGETED_DEVICE_FAMILY: 1,2
  configs:
    Debug:
      INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: YES
targets:
  TooZHubiOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - "**/Resources/**"
      - path: Sources/TooZHub/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: TooZHubiOS
    scheme:
      testTargets: []

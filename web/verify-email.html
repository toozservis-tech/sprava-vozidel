<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ověření e-mailu - Správa vozidel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: radial-gradient(circle at top, #1e293b 0%, #020617 55%, #020617 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .verify-container {
            background: rgba(15, 23, 42, 0.96);
            border-radius: 18px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
            color: #e5e7eb;
        }

        .verify-container h1 {
            color: #f9fafb;
            margin-bottom: 10px;
            text-align: center;
            font-size: 1.8rem;
        }

        .verify-container p {
            color: #9ca3af;
            text-align: center;
            margin-bottom: 30px;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 14px 20px;
            background: #6366f1;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            text-align: center;
            text-decoration: none;
        }

        .btn:hover {
            background: #7c3aed;
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid #374151;
            margin-top: 12px;
        }

        .btn-secondary:hover {
            background: rgba(55, 65, 81, 0.35);
        }

        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .alert-success {
            background: rgba(34, 197, 94, 0.2);
            border: 1px solid rgba(34, 197, 94, 0.4);
            color: #86efac;
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #fca5a5;
        }

        .alert-info {
            background: rgba(59, 130, 246, 0.2);
            border: 1px solid rgba(59, 130, 246, 0.4);
            color: #93c5fd;
        }

        .alert-warning {
            background: rgba(245, 158, 11, 0.2);
            border: 1px solid rgba(245, 158, 11, 0.4);
            color: #fcd34d;
        }

        .loading {
            text-align: center;
            color: #9ca3af;
            margin: 20px 0;
        }

        .spinner {
            display: inline-block;
            width: 24px;
            height: 24px;
            border: 3px solid rgba(99, 102, 241, 0.3);
            border-top-color: #6366f1;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="verify-container">
        <h1>✉️ Ověření e-mailu</h1>
        <p id="subtitle">Dokončete registraci ověřením e-mailové adresy.</p>

        <div id="alertContainer"></div>

        <div id="loadingState" class="loading hidden">
            <span class="spinner"></span>Ověřuji e-mail…
        </div>

        <div id="actionContainer" class="hidden">
            <a href="/web/index.html" class="btn" id="loginButton">Přejít na přihlášení</a>
        </div>
    </div>

    <script>
        (function () {
            'use strict';

            function getApiBaseUrl() {
                var hostname = window.location.hostname;
                if (hostname === 'hub.toozservis.cz') {
                    return 'https://hub.toozservis.cz';
                }
                return window.location.origin;
            }

            var API_URL = getApiBaseUrl();
            var urlParams = new URLSearchParams(window.location.search);
            var verifyToken = urlParams.get('token');

            var alertContainer = document.getElementById('alertContainer');
            var loadingState = document.getElementById('loadingState');
            var actionContainer = document.getElementById('actionContainer');
            var subtitle = document.getElementById('subtitle');

            function showAlert(message, type) {
                var alert = document.createElement('div');
                alert.className = 'alert alert-' + type;
                alert.textContent = message;
                alertContainer.innerHTML = '';
                alertContainer.appendChild(alert);
            }

            function showLoading() {
                loadingState.classList.remove('hidden');
                actionContainer.classList.add('hidden');
            }

            function hideLoading() {
                loadingState.classList.add('hidden');
            }

            function showLoginButton() {
                actionContainer.classList.remove('hidden');
            }

            function parseErrorDetail(data) {
                var detail = data && data.detail;
                if (detail && typeof detail === 'object') {
                    return {
                        code: detail.code || 'token_invalid',
                        message: detail.message || 'Neplatný nebo expirovaný ověřovací odkaz.'
                    };
                }
                if (typeof detail === 'string') {
                    var lower = detail.toLowerCase();
                    if (lower.indexOf('vypršel') !== -1 || lower.indexOf('expirovan') !== -1) {
                        return { code: 'token_expired', message: detail };
                    }
                    return { code: 'token_invalid', message: detail };
                }
                return { code: 'token_invalid', message: 'Neplatný nebo expirovaný ověřovací odkaz.' };
            }

            function handleSuccess(alreadyVerified) {
                hideLoading();
                subtitle.textContent = alreadyVerified
                    ? 'Váš účet je již aktivní.'
                    : 'Registrace byla úspěšně dokončena.';
                showAlert(
                    alreadyVerified
                        ? 'Účet je již ověřen. Můžete se přihlásit.'
                        : 'E-mail ověřen, můžete se přihlásit.',
                    alreadyVerified ? 'warning' : 'success'
                );
                showLoginButton();
            }

            function handleInvalid(code, message) {
                hideLoading();
                subtitle.textContent = 'Ověření se nezdařilo.';
                if (code === 'token_expired') {
                    showAlert(message || 'Odkaz je neplatný nebo expirovaný.', 'error');
                } else {
                    showAlert(message || 'Odkaz je neplatný nebo expirovaný.', 'error');
                }
                showLoginButton();
            }

            function handleConnectionError() {
                hideLoading();
                subtitle.textContent = 'Server není dostupný.';
                showAlert('Chyba spojení se serverem. Zkuste to prosím později.', 'error');
                showLoginButton();
            }

            function handleMissingToken() {
                subtitle.textContent = 'Chybí ověřovací odkaz.';
                showAlert('Neplatný odkaz — chybí ověřovací token. Použijte odkaz z e-mailu.', 'error');
                showLoginButton();
            }

            async function verifyEmail(token) {
                showLoading();
                showAlert('Probíhá ověření e-mailové adresy…', 'info');

                try {
                    var response = await fetch(API_URL + '/user/verify-email', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ token: token })
                    });

                    var data = {};
                    try {
                        data = await response.json();
                    } catch (parseErr) {
                        data = {};
                    }

                    if (response.ok) {
                        handleSuccess(Boolean(data.already_verified));
                        return;
                    }

                    var err = parseErrorDetail(data);
                    if (err.code === 'already_verified') {
                        handleSuccess(true);
                        return;
                    }
                    handleInvalid(err.code, err.message);
                } catch (networkErr) {
                    handleConnectionError();
                }
            }

            if (!verifyToken || !String(verifyToken).trim()) {
                handleMissingToken();
            } else {
                verifyEmail(String(verifyToken).trim());
            }
        })();
    </script>
</body>
</html>

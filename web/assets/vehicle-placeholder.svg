<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Katalogova fotka neni dostupna</title>
  <desc id="desc">Neutralni stav bez ilustrovaneho vozidla pro pripad, kdy katalogova fotka neni k dispozici.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="54%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="48%">
      <stop offset="0%" stop-color="#94a3b8" stop-opacity="0.28"/>
      <stop offset="64%" stop-color="#475569" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#glow)"/>
  <circle cx="1040" cy="142" r="170" fill="#e2e8f0" opacity="0.08"/>
  <circle cx="206" cy="155" r="96" fill="#e2e8f0" opacity="0.06"/>
  <g fill="none" stroke="#cbd5e1" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.74">
    <rect x="548" y="260" width="184" height="136" rx="28"/>
    <path d="M595 260l18-34h54l18 34"/>
    <circle cx="640" cy="328" r="34"/>

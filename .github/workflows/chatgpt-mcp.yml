name: ChatGPT MCP Plugin

on:
  push:
    branches:
      - feature/chatgpt-mcp-plugin-v1
  pull_request:
    paths:
      - "src/plugins/chatgpt_mcp/**"
      - "tests/api/test_chatgpt_mcp_service.py"
      - "requirements.txt"
      - ".github/workflows/chatgpt-mcp.yml"

jobs:
  mcp-plugin:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
      DATABASE_URL: sqlite:///./test_mcp_plugin.db
      VEHICLE_DB_URL: sqlite:///./test_mcp_plugin.db
      TEST_DATABASE_URL: sqlite:///./test_mcp_plugin.db
      JWT_SECRET_KEY: test-secret-key-for-mcp-ci-only
      CHATGPT_MCP_HOST: 127.0.0.1
      CHATGPT_MCP_PORT: 8011
      CHATGPT_MCP_SERVICE_USER_ID: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile plugin
        run: python -m compileall -q src/plugins/chatgpt_mcp

      - name: Import MCP v2 server
        run: |
          python - <<'PY'
          from src.plugins.chatgpt_mcp.server import mcp
          print(type(mcp).__name__)
          PY

      - name: Run MCP service tests
        run: python -m pytest tests/api/test_chatgpt_mcp_service.py -v --tb=short

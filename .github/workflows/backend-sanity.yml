name: Backend Sanity Gate

on:
  workflow_dispatch:

jobs:
  backend-sanity:
    runs-on: ubuntu-latest

    env:
      PYTHON_BIN: python3.12
      TESTING: "1"
      APP_ENV: test
      ENVIRONMENT: test
      DATABASE_URL: sqlite:///./test_vehicles.db
      VEHICLE_DB_URL: sqlite:///./test_vehicles.db
      TEST_DATABASE_URL: sqlite:///./test_vehicles.db
      SECRET_KEY: dummy-ci-secret
      JWT_SECRET_KEY: dummy-ci-jwt-secret
      DISABLE_EXTERNAL_INTEGRATIONS: "1"
      HOST: 127.0.0.1
      PORT: 8000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Run backend sanity gate
        run: bash scripts/backend_sanity_gate.sh
